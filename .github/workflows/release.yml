# build the android apk (arm64) and the x86_64 linux binary whenever a vX.Y.Z
# tag is pushed, then attach both to a github release named after the tag. the
# build name is taken from the tag (v0.1.0 -> 0.1.0); the build number is the
# run number so each build is distinct.
#
# toolchains come from mise.toml (flutter, rust, android-sdk, java), so the ci
# builds with the exact pinned versions.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the release and upload the assets

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v2 # installs mise + the pinned tools from mise.toml
      - name: android ndk + rust android targets
        # the veilid ffi is cross-compiled with cargo via the ndk during the
        # gradle build. the plugin's rust-android build compiles every abi
        # (arm/arm64/x86/x86_64) regardless of --target-platform, so all four
        # rust targets are needed even though the release apk is arm64-only.
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null 2>&1 || true
          mise exec -- sdkmanager "ndk;28.2.13676358"
          mise exec -- rustup target add aarch64-linux-android \
            armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: build apk
        run: >
          mise exec -- flutter build apk --release
          --split-per-abi --target-platform android-arm64
          --build-name "${{ steps.v.outputs.name }}"
          --build-number "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

  linux:
    # build on glibc (ubuntu), matching flutter's prebuilt linux engine, which is
    # glibc-linked. an earlier musl/alpine build hit successive engine-vs-musl
    # incompatibilities (a dropped rust cdylib, then a missing libdl.so.2) with no
    # musl engine to switch to, so glibc is the supported route.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: linux desktop build deps
        # flutter's linux desktop build drives clang/cmake/ninja and links the gtk3
        # dev libraries; the rest (git, gcc, the gnu rust target) is preinstalled.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
      - uses: jdx/mise-action@v2
      - name: build linux
        # the veilid linux plugin cmake assumes an in-monorepo build; patch it for
        # external consumption after pub get (see scripts/patch_veilid_linux.sh).
        # the build's own implicit pub get reuses the cached checkout, so the patch
        # survives.
        run: |
          mise exec -- flutter config --enable-linux-desktop
          mise exec -- flutter pub get
          bash scripts/patch_veilid_linux.sh
          mise exec -- flutter build linux --release \
            --build-name "${{ steps.v.outputs.name }}" \
            --build-number "${{ github.run_number }}"
          tar -C build/linux/x64/release/bundle \
            -czf "veilist-${{ steps.v.outputs.name }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: veilist-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/android/*.apk dist/linux/*.tar.gz
