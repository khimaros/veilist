# build the android apk (arm64) and the x86_64 linux binary whenever a vX.Y.Z
# tag is pushed, then attach both to a github release named after the tag.
#
# the version comes from pubspec.yaml, not from this workflow: a release must be
# reproducible from the tagged source alone, so nothing version-shaped is
# injected here (f-droid rebuilds the same tag and compares, see
# DISTRIBUTION.md). the tag is only checked against the pubspec.
#
# the apk is signed with the project's persistent release key, held in the
# VEILIST_KEYSTORE_* secrets. never fall back to the debug key here: every
# release must carry the same key or android refuses to update.
#
# toolchains come from mise.toml (flutter, rust, android-sdk, java), so the ci
# builds with the exact pinned versions.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the release and upload the assets

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: tag matches pubspec version
        # the apk's version comes from pubspec.yaml, so a tag that disagrees with
        # it would publish something labelled differently from its source.
        run: |
          pubspec="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)"
          if [ "$pubspec" != "${{ steps.v.outputs.name }}" ]; then
            echo "!! tag ${{ steps.v.outputs.name }} != pubspec version $pubspec" >&2
            exit 1
          fi
      - uses: jdx/mise-action@v2 # installs mise + the pinned tools from mise.toml
      - name: android ndk + rust android targets
        # the veilid ffi is cross-compiled with cargo via the ndk during the
        # gradle build. the plugin's rust-android build compiles every abi
        # (arm/arm64/x86/x86_64) regardless of --target-platform, so all four
        # rust targets are needed even though the release apk is arm64-only.
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null 2>&1 || true
          mise exec -- sdkmanager "ndk;28.2.13676358"
          mise exec -- rustup target add aarch64-linux-android \
            armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: release keystore
        # decoded to a file outside the workspace so it cannot be picked up by a
        # later step or archived with the build output.
        env:
          KEYSTORE_BASE64: ${{ secrets.VEILIST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "!! VEILIST_KEYSTORE_BASE64 is not set; refusing to publish a" \
                 "debug-signed apk (see DISTRIBUTION.md)" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: build apk
        env:
          VEILIST_KEYSTORE: ${{ runner.temp }}/release.jks
          VEILIST_KEYSTORE_PASSWORD: ${{ secrets.VEILIST_KEYSTORE_PASSWORD }}
          VEILIST_KEY_ALIAS: ${{ secrets.VEILIST_KEY_ALIAS }}
          VEILIST_KEY_PASSWORD: ${{ secrets.VEILIST_KEY_PASSWORD }}
        run: >
          mise exec -- flutter build apk --release
          --split-per-abi --target-platform android-arm64
      - name: confirm the apk carries the release key
        # a misconfigured secret would otherwise fall back to a debug key and
        # publish an apk nobody can upgrade from. run under `mise exec` so
        # ANDROID_HOME points at the pinned sdk.
        run: |
          mise exec -- bash -c '
            apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
            "$apksigner" verify --print-certs \
              build/app/outputs/flutter-apk/app-arm64-v8a-release.apk > certs.txt'
          if grep -q "CN=Android Debug" certs.txt; then
            echo "!! apk is debug-signed" >&2
            exit 1
          fi
          grep "SHA-256 digest" certs.txt
      - name: clean up the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

  linux:
    # build on glibc (ubuntu), matching flutter's prebuilt linux engine, which is
    # glibc-linked. an earlier musl/alpine build hit successive engine-vs-musl
    # incompatibilities (a dropped rust cdylib, then a missing libdl.so.2) with no
    # musl engine to switch to, so glibc is the supported route.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: linux desktop build deps
        # flutter's linux desktop build drives clang/cmake/ninja and links the gtk3
        # dev libraries; the rest (git, gcc, the gnu rust target) is preinstalled.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
      - uses: jdx/mise-action@v2
      - name: build linux
        # the veilid linux plugin cmake assumes an in-monorepo build; patch it for
        # external consumption after pub get (see scripts/patch_veilid_linux.sh).
        # the build's own implicit pub get reuses the cached checkout, so the patch
        # survives.
        run: |
          mise exec -- flutter config --enable-linux-desktop
          mise exec -- flutter pub get
          bash scripts/patch_veilid_linux.sh
          mise exec -- flutter build linux --release
          tar -C build/linux/x64/release/bundle \
            -czf "veilist-${{ steps.v.outputs.name }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: veilist-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/android/*.apk dist/linux/*.tar.gz
