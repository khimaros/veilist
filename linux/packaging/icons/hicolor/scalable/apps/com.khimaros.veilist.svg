<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- dark-mode monochrome app icon: a security shield holding a checklist.
       drawn in the arcticons manner: ONE uniform hairline for every stroke,
       round ends, and a glyph inset well inside the tile rather than filling
       it. the palette is measured, not guessed - a launcher running an
       arcticons pack draws its tiles #303030 with ~#c3c3c3 glyphs, and matching
       that keeps this icon from shouting next to them. keep the geometry in
       step with veilist_icon_fg.svg. -->
  <rect width="512" height="512" rx="112" fill="#303030"/>
  <g transform="translate(256,256) scale(0.685) translate(-256,-264)"
     fill="none" stroke="#c3c3c3" stroke-width="8"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- shield -->
    <path d="M256 92 L392 148 V272 C392 348 332 406 256 436 C180 406 120 348 120 272 V148 Z"/>
    <!-- checklist: three rows of check + line -->
    <path d="M158 196 l16 16 l26 -32"/>
    <line x1="224" y1="200" x2="350" y2="200"/>
    <path d="M158 258 l16 16 l26 -32"/>
    <line x1="224" y1="262" x2="350" y2="262"/>
    <path d="M158 320 l16 16 l26 -32"/>
    <line x1="224" y1="324" x2="350" y2="324"/>
  </g>
</svg>
