<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- dark-mode monochrome app icon: a security shield holding a checklist. -->
  <rect width="512" height="512" rx="112" fill="#121318"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- shield -->
    <path d="M256 92 L392 148 V272 C392 348 332 406 256 436 C180 406 120 348 120 272 V148 Z"
          stroke-width="20"/>
    <!-- checklist: three rows of check + line -->
    <g stroke-width="17">
      <path d="M158 196 l16 16 l26 -32"/>
      <line x1="224" y1="200" x2="350" y2="200"/>
      <path d="M158 258 l16 16 l26 -32"/>
      <line x1="224" y1="262" x2="350" y2="262"/>
      <path d="M158 320 l16 16 l26 -32"/>
      <line x1="224" y1="324" x2="350" y2="324"/>
    </g>
  </g>
</svg>
