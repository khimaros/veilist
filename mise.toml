[tools]
# flutter drives the android/linux/web builds; dart ships inside it.
flutter = "3.44.3-stable"
# rust builds the veilid native library (ffi) and the wasm blob for web.
rust = "1.95.0"
# android sdk + jdk for the android build and the emulator e2e. the emulator
# package and a system image are added into this sdk by scripts/android_e2e.sh.
android-sdk = "16.0"
java = "temurin-21"
