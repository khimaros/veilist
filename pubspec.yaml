name: veilist
description: "simple, private list sharing over the veilid network."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# version name + build number (android versionName + versionCode). this is the
# ONE place the version lives: releases are built from the pubspec, never from a
# ci-injected --build-name/--build-number, so anyone rebuilding a tag - f-droid's
# rebuilder included - gets the same version out of the same source.
#
# the build number follows major*1000000 + minor*1000 + patch and must only ever
# increase, because android refuses to install a lower versionCode. note that
# `--split-per-abi` (how releases are built) adds an abi offset on top of it:
# arm64 ships as 3000 + 2000 = 5000. the pre-0.3 releases were run-number based
# and landed at 2005/2006 for arm64, so 3000 clears them.
version: 0.4.0+4000

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # veilid provides the p2p network + dht records that back every list.
  # pinned to a release tag for deterministic builds; the plugin compiles its
  # own rust native library during the flutter build (see DESIGN.md).
  veilid:
    git:
      url: https://gitlab.com/veilid/veilid.git
      ref: v0.5.6
      path: veilid-flutter

  # app_links delivers incoming share links (custom scheme + universal/app
  # links on mobile, the page url on web) so a link opens the right list (R2).
  app_links: ^7.2.1

  # material you: pull the accent color from the device (android 12+), falling
  # back to a seed color.
  dynamic_color: ^1.7.0

  # renders the share link as a scannable qr code in the share dialog.
  qr_flutter: ^4.1.0

  # reads that qr code back with the device camera (R1, R2). camera capture has
  # no dart/flutter standard-library route, so a plugin is unavoidable (R10).
  # this one decodes in pure dart (a zxing port) over the flutter camera plugin:
  # no proprietary blob, which mobile_scanner's google ml kit backend would have
  # put in the apk and which both f-droid and izzyondroid refuse (DISTRIBUTION.md).
  qr_code_dart_scan: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # exposes the flutter driver extension so appium can drive the real ui (see
  # test/driver/app.dart and test/e2e/appium/).
  flutter_driver:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # deterministic virtual time for the sync/reconcile unit tests (drives
  # OpenList's periodic timer without real waiting).
  fake_async: ^1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
